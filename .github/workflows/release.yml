name: release

# 发布流水线（票 09 / O-09，ADR-0010）。推 v* tag 触发：测试不过不发布；
# 产物三件套 = shiyu-win-x64.zip + .sha256 + .sig（ECDSA P-256，私钥只存在
# 仓库 secret SHIYU_UPDATE_SIGNING_KEY 里）；发布前用与客户端内置公钥
# （Shiyu.Core UpdateSignature.BuiltInPublicKey）同一把的 pub.pem 在 runner
# 上复验一次——两处钥匙不一致时这一步红掉，而不是把没验过的包发出去。
# 安装包（ADR-0015）同样三件套：shiyu-win-x64-setup.exe + .sha256 + .sig；
# 装、查、删数据、卸的冒烟不过，同样不发布。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 发布说明要写"上个 tag 以来合了什么"，浅克隆看不到。
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: 从 tag 取版本
        id: version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # tag 带 -（如 v0.9.0-rc1）按预发布处理。releases/latest 不返回
          # 预发布版本，所以 rc 不会出现在老客户端的自动更新里——想尝鲜的
          # 用户只能来 Release 页手动下载，这正是 rc 想要的受众。
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Core 测试（不过不发布）
        run: dotnet test tests/Shiyu.Core.Tests -c Release

      - name: 平台层测试（不过不发布）
        run: dotnet test tests/Shiyu.Windows.Tests -c Release

      - name: 发布 self-contained win-x64
        run: dotnet publish src/Shiyu.App/Shiyu.App.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -o publish

      # O-41：发出去的程序集里不许有任何 SHIYU_ 字面量，扫不过不发布。
      - name: 发布产物不带调试开关
        shell: pwsh
        run: |
          foreach ($dll in 'Shiyu.App.dll', 'Shiyu.Core.dll', 'Shiyu.Windows.dll') {
            & tools/checks/scan-release-overrides.ps1 -Exe (Join-Path publish $dll)
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: 打 zip 与校验和
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          # zip 内部布局必须与 UpdateStaging.VerifyInstaller/Extract 的期望
          # 一致：publish 的内容（含 Shiyu.App.exe）全在 zip 根目录、不带
          # 外层文件夹——解压到 staged\ 后，ApplyAndRestart 要在
          # staged\Shiyu.App.exe 找到新程序。本仓库的发布包演练测试
          # （ReleasePackagingDrillTests）按同样布局验收。
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Join-Path $PWD 'publish'), (Join-Path $PWD 'shiyu-win-x64.zip'),
            [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $hash = (Get-FileHash shiyu-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          # 格式与 UpdateStaging.VerifyInstaller 的解析一致：首个空白分隔字段是十六进制哈希。
          "$hash  shiyu-win-x64.zip" | Set-Content -NoNewline shiyu-win-x64.zip.sha256

      # Inno Setup 版本钉死在 install-inno.ps1 里（下载按 SHA-256 核对、便携解包）：
      # 构建机悄悄换了大版本，发出去的安装包也会跟着变。
      - name: 打安装包与校验和（ADR-0015）
        shell: pwsh
        run: |
          $iscc = & tools/installer/install-inno.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'inno')
          $setup = & tools/installer/build-installer.ps1 -Version '${{ steps.version.outputs.version }}' -PublishDir publish -OutputDir $PWD -Iscc $iscc
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  shiyu-win-x64-setup.exe" | Set-Content -NoNewline shiyu-win-x64-setup.exe.sha256

      # 构建机是一次性的：这里可以放心试"连数据一起删"与卸载时清自启（-DestructiveChecks）。
      - name: 安装包冒烟（静默装 → 查 → 删数据 → 静默卸，不过不发布）
        shell: pwsh
        run: tools/installer/smoke-installer.ps1 -Setup shiyu-win-x64-setup.exe -Version '${{ steps.version.outputs.version }}' -WithDesktopIcon -DestructiveChecks

      - name: 签名（私钥只在临时文件里存在片刻）
        shell: pwsh
        env:
          SHIYU_UPDATE_SIGNING_KEY: ${{ secrets.SHIYU_UPDATE_SIGNING_KEY }}
        run: |
          # 私钥是 PKCS#8 PEM（仓库 secret）：绝不 echo、绝不进日志、绝不进产物。
          $openssl = (Get-Command openssl -ErrorAction SilentlyContinue).Source
          if (-not $openssl) { $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe' }
          $key = New-TemporaryFile
          try {
            [System.IO.File]::WriteAllText($key, $env:SHIYU_UPDATE_SIGNING_KEY)
            & $openssl dgst -sha256 -sign $key -out shiyu-win-x64.zip.sig shiyu-win-x64.zip
            & $openssl dgst -sha256 -sign $key -out shiyu-win-x64-setup.exe.sig shiyu-win-x64-setup.exe
          }
          finally {
            Remove-Item $key -Force -ErrorAction SilentlyContinue
          }

      - name: 发布前用公钥复验一次
        shell: pwsh
        run: |
          # 与客户端内置公钥（Shiyu.Core UpdateSignature.BuiltInPublicKey）
          # 同一把：私钥配错了钥匙，这里就红，绝不让没验过的包出仓。
          @'
          -----BEGIN PUBLIC KEY-----
          MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEJ12pHGKuZN4YEGgNi8ij3M8W3FPf
          DvnRF5rToPQDvLPloNU3CrpiVuc7zoN97BeWFiOvaowf8J9p1jBU8VD6uw==
          -----END PUBLIC KEY-----
          '@ | Set-Content -NoNewline pub.pem
          $openssl = (Get-Command openssl -ErrorAction SilentlyContinue).Source
          if (-not $openssl) { $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe' }
          try {
            foreach ($file in 'shiyu-win-x64.zip', 'shiyu-win-x64-setup.exe') {
              & $openssl dgst -sha256 -verify pub.pem -signature "$file.sig" $file
              if ($LASTEXITCODE -ne 0) { throw "signature check failed for $file" }
            }
          }
          finally {
            Remove-Item pub.pem -Force -ErrorAction SilentlyContinue
          }

      # 发布说明 = CHANGELOG 里这个版本的那一节（发布清单：二者一致）；CHANGELOG 没写这一版时
      # 退回提交标题列表——总比空着强，但那是忘了写 CHANGELOG 的信号。
      - name: 生成发布说明
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { found = 1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
            {
              echo "拾语 $version"
              echo
              git log "$range" --pretty=format:"- %s"
              echo
            } > release-notes.md
          fi

      - name: 创建 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(release create "$GITHUB_REF_NAME"
                shiyu-win-x64-setup.exe shiyu-win-x64-setup.exe.sha256 shiyu-win-x64-setup.exe.sig
                shiyu-win-x64.zip shiyu-win-x64.zip.sha256 shiyu-win-x64.zip.sig
                --title "拾语 ${{ steps.version.outputs.version }}"
                --notes-file release-notes.md)
          # rc 之类预发布：加 --prerelease，理由见"从 tag 取版本"步骤里的注释。
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
