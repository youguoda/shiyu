# 拾语 CI：Windows 上构建整个解决方案并跑 Core 与平台层单测，另一台 Windows 打安装包
# 并真装真卸一遍；Linux 上跑公共通道 Worker 的类型检查与 vitest。三个 job
# 互不依赖，并行执行。
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# 同一分支（或同一个 PR）有新提交时，取消还在跑的旧运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    # Shiyu.App / Shiyu.Windows 是 net9.0-windows（WPF），只能在 Windows 上构建。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: 还原依赖
        run: dotnet restore Shiyu.sln

      - name: 构建（Release）
        run: dotnet build Shiyu.sln -c Release --no-restore

      - name: Core 单测
        id: test
        run: dotnet test tests/Shiyu.Core.Tests/Shiyu.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=core-tests.trx" --results-directory TestResults

      # 测试矩阵 G-01：平台层测试只用不显示的窗口、从不注册真热键，构建机上能跑。
      - name: 平台层单测
        id: windows-test
        if: success() || steps.test.outcome == 'failure'
        run: dotnet test tests/Shiyu.Windows.Tests/Shiyu.Windows.Tests.csproj -c Release --no-build --logger "trx;LogFileName=windows-tests.trx" --results-directory TestResults

      # O-41：Release 程序集里不许有任何 SHIYU_ 字面量——调试开关的名字都不能留。
      - name: Release 产物不带调试开关
        shell: pwsh
        run: |
          $bin = 'src/Shiyu.App/bin/Release/net9.0-windows10.0.17763.0'
          foreach ($dll in 'Shiyu.App.dll', 'Shiyu.Core.dll', 'Shiyu.Windows.dll') {
            & tools/checks/scan-release-overrides.ps1 -Exe (Join-Path $bin $dll)
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # O-24：catch (Exception) 块必须接日志或声明 expected——静默即失败。
      - name: 静默 catch 检查
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/checks/no-silent-catch.ps1

      # 票 19：Themes/ 外禁字面量字号/圆角/文字透明度——字面量会绕过令牌与对比度测试。
      # 豁免须带 token-ok: 注释写明理由。
      - name: 硬编码令牌检查
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/checks/no-hardcoded-tokens.ps1

      - name: 单测失败时上传结果
        if: failure() && (steps.test.outcome == 'failure' || steps.windows-test.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 7

  # 安装包（ADR-0015）：每次推送都真装一遍、真卸一遍，别等到发版那天才发现它坏了。
  # 与发布流水线走同一组脚本（tools/installer/），构建机是一次性的，可以放心跑
  # "连数据一起删"与清自启的检查。
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: 发布 self-contained win-x64
        run: dotnet publish src/Shiyu.App/Shiyu.App.csproj -c Release -r win-x64 --self-contained true -p:Version=0.0.0-ci -o publish

      - name: 打安装包
        shell: pwsh
        run: |
          $iscc = & tools/installer/install-inno.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'inno')
          & tools/installer/build-installer.ps1 -Version '0.0.0-ci' -PublishDir publish -OutputDir $PWD -Iscc $iscc | Out-Null

      - name: 安装包冒烟（静默装 → 查 → 删数据 → 静默卸）
        shell: pwsh
        run: tools/installer/smoke-installer.ps1 -Setup shiyu-win-x64-setup.exe -Version '0.0.0-ci' -WithDesktopIcon -DestructiveChecks

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      # package.json 没有 engines 字段；锁定的 wrangler 4 / miniflare 要求 Node >= 22。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单测（vitest）
        run: npm test
